[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --strict-config
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
filterwarnings =
    # Suppress deprecation warnings for deprecated functions being tested
    ignore:list_nifti_from_folders\(\) is deprecated:DeprecationWarning
    ignore:match_modalities_by_subject\(\) is deprecated:DeprecationWarning
    ignore:folder_mode_to_split_lists\(\) is deprecated:DeprecationWarning
